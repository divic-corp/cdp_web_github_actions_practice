name: Temporary GS Subsidy Second Round Downloader

on:
  push:
    branches:
      - chore/gs-subsidy-download-20261008
    paths:
      - .github/workflows/temporary-gs-subsidy-download.yml

permissions:
  contents: read

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch current second-round official materials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p official/downloads official/extracted

          python3 - <<'PY'
          import hashlib
          import html.parser
          import json
          import os
          import re
          import time
          import urllib.parse
          import urllib.request
          import zipfile

          BASE = "https://r7h-gs-hojo-web-fspoc.jp/"
          NOW = str(int(time.time()))

          def get(url):
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0 (compatible; DIVIC-official-material-archiver/1.0)",
                      "Cache-Control": "no-cache",
                      "Pragma": "no-cache",
                  },
              )
              with urllib.request.urlopen(req, timeout=60) as resp:
                  return resp.read(), resp.headers.get("Content-Type", "")

          html_bytes, _ = get(BASE + "?_=" + NOW)
          html_text = html_bytes.decode("utf-8", errors="replace")
          open("official/index-current.html", "wb").write(html_bytes)

          # Guard against accidentally archiving a stale/irrelevant page.
          if "二次公募" not in html_text:
              raise SystemExit("Current official page does not contain 二次公募")
          if "2026年10月23日" not in html_text and "10月23日" not in html_text:
              raise SystemExit("Current official page does not contain the expected second-round deadline")

          class Parser(html.parser.HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.links = []
                  self.href = None
                  self.text = []
              def handle_starttag(self, tag, attrs):
                  if tag.lower() == "a":
                      self.href = dict(attrs).get("href")
                      self.text = []
              def handle_data(self, data):
                  if self.href is not None:
                      self.text.append(data)
              def handle_endtag(self, tag):
                  if tag.lower() == "a" and self.href is not None:
                      label = " ".join("".join(self.text).split())
                      self.links.append((label, self.href))
                      self.href = None
                      self.text = []

          p = Parser()
          p.feed(html_text)

          # Capture official downloadable application materials linked by the current live page.
          labels = (
              "様式", "募集要領", "交付規程", "セルフチェック",
              "公募概要", "説明会", "申請", "FAQ"
          )
          ext_ok = re.compile(r"\.(?:zip|pdf|docx?|xlsx?|pptx?)(?:$|\?)", re.I)

          selected = []
          for label, href in p.links:
              if not href:
                  continue
              url = urllib.parse.urljoin(BASE, href)
              host = urllib.parse.urlparse(url).hostname or ""
              if host != "r7h-gs-hojo-web-fspoc.jp":
                  continue
              if any(k in label for k in labels) and ext_ok.search(url):
                  selected.append((label, url))

          # De-duplicate while retaining page order.
          deduped = []
          seen = set()
          for label, url in selected:
              if url in seen:
                  continue
              seen.add(url)
              deduped.append((label, url))

          if not deduped:
              raise SystemExit("No current official downloadable materials found")

          manifest = []
          forms_found = False
          for i, (label, url) in enumerate(deduped, 1):
              path = urllib.parse.urlparse(url).path
              basename = os.path.basename(path) or f"official-{i}"
              out = os.path.join("official", "downloads", basename)
              data, ctype = get(url)
              open(out, "wb").write(data)
              sha = hashlib.sha256(data).hexdigest()
              item = {
                  "label": label,
                  "url": url,
                  "file": basename,
                  "size": len(data),
                  "sha256": sha,
                  "content_type": ctype,
              }
              manifest.append(item)

              # Identify the live "様式" ZIP from link label, not a guessed filename.
              if "様式" in label and basename.lower().endswith(".zip"):
                  forms_found = True
                  forms_dir = os.path.join("official", "extracted", "application_forms")
                  os.makedirs(forms_dir, exist_ok=True)
                  with zipfile.ZipFile(out, "r") as z:
                      z.extractall(forms_dir)
                  item["extracted_to"] = "extracted/application_forms"

          if not forms_found:
              raise SystemExit("The live page did not expose a ZIP link labelled 様式")

          with open("official/manifest.json", "w", encoding="utf-8") as f:
              json.dump({
                  "source": BASE,
                  "retrieved_unix": int(time.time()),
                  "guard": "live page contains second-round deadline",
                  "materials": manifest,
              }, f, ensure_ascii=False, indent=2)

          with open("official/manifest.tsv", "w", encoding="utf-8") as f:
              f.write("label\tfile\tsize\tsha256\turl\n")
              for x in manifest:
                  f.write(f'{x["label"]}\t{x["file"]}\t{x["size"]}\t{x["sha256"]}\t{x["url"]}\n')

          print(json.dumps(manifest, ensure_ascii=False, indent=2))
          PY

          echo "=== Archived files ==="
          find official -type f -printf '%P\t%s bytes\n' | sort

      - name: Upload current official material bundle
        uses: actions/upload-artifact@v4
        with:
          name: gs-subsidy-second-round-official-20261008
          path: official/
          if-no-files-found: error
          retention-days: 1
